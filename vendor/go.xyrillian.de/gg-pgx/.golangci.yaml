version: "2"
run:
  timeout: 3m0s # none by default in v2

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0 # no limit
  max-same-issues: 0       # no limit

linters:
  default: standard
  enable:
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - gosec
    - intrange
    - misspell
    - musttag
    - nilerr
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - unconvert
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    goconst:
      min-occurrences: 6
    gocritic:
      disable-all: true
      enabled-checks:
        - boolExprSimplify
        - builtinShadow
        - emptyStringTest
        - evalOrder
        - httpNoBody
        - importShadow
        - initClause
        - methodExprCall
        - paramTypeCombine
        - preferFilepathJoin
        - ptrToRefParam
        - redundantSprint
        - returnAfterHttpError
        - stringConcatSimplify
        - timeExprSimplify
        - truncateCmp
        - typeAssertChain
        - typeUnparen
        - unnamedResult
        - unnecessaryBlock
        - unnecessaryDefer
        - weakCond
        - yodaStyleExpr
    gomoddirectives:
      toolchain-forbidden: true
      go-version-pattern: 1\.\d+(\.0)?$
    gosec:
      excludes:
        - G204 # gosec likes to scream about the fact that we are passing paths derived from $PWD into command invocations
        - G306 # gosec does not understand how umask works
    nolintlint:
      require-specific: true
    staticcheck:
      dot-import-whitelist:
        - go.xyrillian.de/gg/option
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        text: declaration of "err" shadows declaration at
      - path: _test\.go
        linters: [ goconst ]
