name: Checks
"on":
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
  workflow_dispatch: {}
permissions:
  checks: write
  contents: read
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          check-latest: true
          go-version: 1.27.1
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
      - name: Delete pre-installed shellcheck
        run: sudo rm -f "$(which shellcheck)"
      - name: Run shellcheck
        run: make run-shellcheck
      - name: Dependency Licenses Review
        run: make check-dependency-licenses
      - name: Check for spelling errors
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1
        env:
          CLICOLOR: "1"
      - name: Check if source code files have license header
        run: make check-addlicense
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6
